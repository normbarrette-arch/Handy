name: "Personal Windows Build"

# Auto-builds a signed Windows MSI of the `personal` branch and publishes
# it to a rolling GitHub Release tagged `personal-latest`. Includes signed
# `latest.json` so Handy's built-in updater can auto-upgrade installed
# copies. Both PCs install the first MSI once; every subsequent push
# updates them automatically.

on:
  push:
    branches: [personal]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

permissions:
  contents: write

# Cancel a previous run on the same branch when a new push comes in —
# saves CI minutes during rapid iteration.
concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      # Bump tauri.conf.json version to a monotonically-increasing build
      # number so the updater detects each new build as newer. We start at
      # patch=100 to stay above the upstream 0.8.x line without colliding.
      - name: Bump version
        shell: pwsh
        run: |
          $patch = 100 + ${{ github.run_number }}
          $newVersion = "0.8.$patch"
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $newVersion
          # Preserve key order is impossible with ConvertTo-Json on PSCustomObject,
          # so use a regex replace on the raw text instead.
          $raw = Get-Content src-tauri/tauri.conf.json -Raw
          $raw = $raw -replace '"version":\s*"[^"]+"', "`"version`": `"$newVersion`""
          Set-Content -Path src-tauri/tauri.conf.json -Value $raw -NoNewline
          echo "BUILD_VERSION=$newVersion" >> $env:GITHUB_ENV
          Write-Host "Built version: $newVersion"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: personal-windows-x64
          cache-on-failure: true

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # whisper-rs-sys cmake builds create paths that exceed Windows MAX_PATH.
      - name: Shorten build path
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          echo "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV

      - name: Install JS deps
        run: bun install

      # tauri-action builds the NSIS setup.exe, signs it with
      # TAURI_SIGNING_PRIVATE_KEY (creating .sig), generates latest.json
      # with the embedded signed signature, then uploads all three to the
      # release at `tagName`. NSIS (not MSI) because Tauri's Windows
      # auto-updater needs the per-user setup.exe + installMode:passive —
      # MSI auto-update stalls on the msiexec UAC elevation.
      - name: Build + sign + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Disable AVX/FMA/F16C/AVX2 for CPU compatibility — Vulkan handles
          # heavy compute on the GPU so the perf impact is negligible.
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        with:
          tagName: personal-latest
          releaseName: "Personal build ${{ env.BUILD_VERSION }}"
          prerelease: true
          releaseBody: |
            Automated build of the `personal` branch.

            **Version:** `${{ env.BUILD_VERSION }}`
            **Includes:** focus-restore fix (#315) for Windows + Linux X11.
            **Source:** commit `${{ github.sha }}`.

            ## First-time install (one-time transition from MSI)
            1. Quit any running Handy (tray → Quit).
            2. Download the `*-setup.exe` below.
            3. Run it (per-user install, no admin prompt).
            4. Launch Handy. Reconfigure post-processing if needed
               (Advanced → Experimental → Post Processing toggle).

            ## Subsequent updates
            From this build onward, in-app update works end-to-end:
            tray → Check for updates → footer "Update available".
            NSIS + passive install, no UAC.
          args: "--bundles nsis"

      # Prune AFTER a successful publish, not before. tauri-action has
      # already uploaded the new version's setup.exe + .sig + latest.json,
      # so deleting only the non-current assets here means the release is
      # never empty — even mid-build it still serves the previous version.
      # Also fix the release name: tauri-action sets it on creation but
      # won't rename an existing rolling release, so it goes stale.
      - name: Prune old assets + refresh release name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="${BUILD_VERSION}"
          echo "Keeping assets for version $keep"
          gh release view personal-latest --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | while read -r asset; do
            [ -z "$asset" ] && continue
            case "$asset" in
              *"$keep"*|latest.json) echo "keep  $asset" ;;
              *) echo "prune $asset"
                 gh release delete-asset personal-latest "$asset" \
                   --repo "$GITHUB_REPOSITORY" --yes || true ;;
            esac
          done
          gh release edit personal-latest --repo "$GITHUB_REPOSITORY" \
            --title "Personal build $keep" || true
